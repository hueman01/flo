<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola mi hija Hermosa</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100%;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('img/amar.png') no-repeat center center/cover;
            font-family: 'Arial', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        body {
            min-height: 100vh;
            padding: 24px;
        }

        .intro {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(16px, 4vw, 30px);
        }

        h1, h2 {
            color: rgb(21, 172, 66);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            text-align: center;
            width: 100%;
            min-width: 0;
            max-width: 100%;
            line-height: 1.15;
            overflow-wrap: anywhere;
        }

        h1 {
            font-size: clamp(1.55rem, 4vw, 4.2rem);
            animation: fadeInOut 3s infinite; /* Animación suave */
        }

        h2 {
            font-size: clamp(1rem, 2.5vw, 2.4rem);
            animation: pulse 2s infinite; /* Pequeño efecto de pulsación */
        }

        h1 span {
            display: block;
        }

        button {
            font-size: clamp(1rem, 2vw, 1.8rem);
            padding: clamp(12px, 3vw, 16px) clamp(22px, 6vw, 34px);
            border: none;
            background-color: #ff3366;
            color: white;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.4);
            min-width: 0;
            max-width: 100%;
        }

        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding-top: 16vh;
            }

            h1 {
                font-size: clamp(1.65rem, 8vw, 2.25rem);
            }

            h2 {
                font-size: clamp(1rem, 5vw, 1.35rem);
            }
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>
    <div class="intro">
        <h1>Hola Fernanda<br>Hueman Moreno<span>(●'◡'●)💕</span></h1>
        <h2>Tengo un regalo para ti ✍(◔◡◔)</h2>
        <button onclick="window.location.href='rosas.html'">Ver regalo 💛</button>
    </div>
</body>
</html>
